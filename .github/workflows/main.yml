name: Build Web to Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" ! -name "*apk*.zip" | head -n 1)
          echo "Unzipping: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build web app, set app icon and name, and build APK
        run: |
          APP_DIR=$(find extracted_project -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          cd "$APP_DIR"
          npm install --legacy-peer-deps
          npm run build

          WEB_DIR="dist"
          if [ ! -d "$WEB_DIR" ] && [ -d "build" ]; then
            WEB_DIR="build"
          fi

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.rafiq.alquran",
            "appName": "رفيق القرآن",
            "webDir": "$WEB_DIR"
          }
          EOF

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets --legacy-peer-deps
          npx cap add android
          npx cap sync android

          ICON_SRC="public/icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC=$(find . -maxdepth 4 -iname "*icon*.png" -o -iname "*rafiq*.png" | head -n 1)
          fi
          if [ -n "$ICON_SRC" ]; then
            mkdir -p assets
            cp "$ICON_SRC" assets/icon.png
            npx capacitor-assets generate --android --iconBackgroundColor '#0B3D32' --iconBackgroundColorDark '#0B3D32'
          fi

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            cat <<EOF > "$STRINGS_FILE"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">رفيق القرآن</string>
              <string name="title_activity_main">رفيق القرآن</string>
              <string name="package_name">com.rafiq.alquran</string>
              <string name="custom_url_scheme">com.rafiq.alquran</string>
          </resources>
          EOF
          fi

          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            python3 - << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.RECORD_AUDIO",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE"
          ]

          to_add = [f'    <uses-permission android:name="{p}" />' for p in permissions if p not in content]
          if to_add and "<application" in content:
              content = content.replace("<application", "\n".join(to_add) + "\n\n    <application", 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PYEOF
          fi

          cd android
          if [ -f "variables.gradle" ]; then
            sed -i "s/kotlinVersion = .*/kotlinVersion = '1.9.24'/g" variables.gradle
          fi
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-alquran-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
