دname: Build Web to Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" ! -name "*apk*.zip" ! -path "./extracted_project/*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted_project
          else
            echo "No source zip found, copying repository files to extracted_project..."
            rsync -a --exclude='.git' --exclude='.github' --exclude='extracted_project' --exclude='*.zip' ./ extracted_project/
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build web app, configure permissions, icon, name, and build APK
        run: |
          APP_DIR=$(find extracted_project -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "package.json not found! Listing extracted_project:"
            find extracted_project -maxdepth 3
            exit 1
          fi
          echo "Found project directory: $APP_DIR"
          cd "$APP_DIR"
          npm install --legacy-peer-deps
          npm run build

          WEB_DIR="dist"
          if [ ! -d "$WEB_DIR" ] && [ -d "build" ]; then
            WEB_DIR="build"
          fi

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.rafiq.alquran",
            "appName": "رفيق القرآن",
            "webDir": "$WEB_DIR"
          }
          EOF

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets @capacitor/local-notifications --legacy-peer-deps
          npx cap add android
          npx cap sync android

          ICON_SRC="public/icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC=$(find . -maxdepth 4 -iname "*icon*.png" -o -iname "*rafiq*.png" | head -n 1)
          fi
          if [ -n "$ICON_SRC" ]; then
            mkdir -p assets
            cp "$ICON_SRC" assets/icon.png
            npx capacitor-assets generate --android --iconBackgroundColor '#0B3D32' --iconBackgroundColorDark '#0B3D32'
          fi

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            cat <<EOF > "$STRINGS_FILE"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">رفيق القرآن</string>
              <string name="title_activity_main">رفيق القرآن</string>
              <string name="package_name">com.rafiq.alquran</string>
              <string name="custom_url_scheme">com.rafiq.alquran</string>
          </resources>
          EOF
          fi

          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            python3 -c '
          import sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.RECORD_AUDIO",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE"
          ]

          insert_lines = []
          for p in perms:
              if p not in content:
                  insert_lines.append(f"    <uses-permission android:name=\"{p}\" />")

          if insert_lines and "<application" in content:
              content = content.replace("<application", "\n".join(insert_lines) + "\n\n    <application", 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          ' "$MANIFEST_FILE"
          fi

          rm -rf ~/.gradle/caches

          cd android
          if [ -f "variables.gradle" ]; then
            sed -i "s/kotlinVersion = .*/kotlinVersion = '1.9.24'/g" variables.gradle
          fi
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2 -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-alquran-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
